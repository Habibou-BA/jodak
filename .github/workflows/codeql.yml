name: CodeQL

# Analyse statique de sécurité (SAST) du code Java, adaptée à un dépôt public.
# Utilise le mode « none » : CodeQL analyse le code sans build (pas de JDK à configurer).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # chaque lundi à 03h17 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyse CodeQL (Java)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Initialisation de CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: none

      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
