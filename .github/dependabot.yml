version: 2

# Surveille et propose (via PR) les mises à jour des dépendances Maven et des
# actions GitHub utilisées dans les workflows.
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    ignore:
      # Spring Boot 4 = migration majeure (Spring Framework 7, Jakarta EE 11, API retirées).
      # À traiter comme un chantier dédié, pas comme un bump automatique. On conserve les
      # mises à jour mineures/patch de la branche 3.x.
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
    groups:
      spring:
        patterns: ["org.springframework*"]
      testcontainers:
        patterns: ["org.testcontainers*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
