# Configuration commune (tous profils). Le profil actif par défaut est "dev".
spring:
  application:
    name: olympics-platform
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Hibernate valide le schéma Flyway, ne le modifie jamais
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true             # erreurs au format ProblemDetail (RFC 7807)
  servlet:
    multipart:
      max-file-size: ${IMPORT_MAX_FILE_SIZE:25MB}
      max-request-size: ${IMPORT_MAX_REQUEST_SIZE:30MB}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

# Sécurité JWT (le secret DOIT être surchargé en production via JWT_SECRET).
jwt:
  secret: ${JWT_SECRET:dev-secret-a-remplacer-en-production-0123456789-abcdefghijklmnopqrstuvwxyz}
  issuer: ${JWT_ISSUER:jodak}
  access-ttl: ${JWT_ACCESS_TTL:PT15M}
  refresh-ttl: ${JWT_REFRESH_TTL:P7D}

# Création automatique du premier administrateur (premier démarrage uniquement).
admin:
  bootstrap:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  # Réinitialisation de la plateforme (désactivée par défaut, notamment en production).
  reset:
    enabled: ${ADMIN_RESET_ENABLED:false}
    confirmation-phrase: ${ADMIN_RESET_CONFIRMATION_PHRASE:REINITIALISER-DAKAR-2026}

# Import asynchrone de données.
import:
  storage-dir: ${IMPORT_STORAGE_DIR:${java.io.tmpdir}/jodak-imports}
  chunk-size: ${IMPORT_CHUNK_SIZE:500}
  max-concurrent-jobs: ${IMPORT_MAX_CONCURRENT_JOBS:2}

# Sauvegarde logique (export ZIP).
backup:
  storage-dir: ${BACKUP_STORAGE_DIR:${java.io.tmpdir}/jodak-backups}
