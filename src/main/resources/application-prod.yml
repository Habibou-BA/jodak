# Profil PROD : configuration via variables d'environnement, aucune donnée sensible en dur.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false
  flyway:
    locations: classpath:db/migration    # jamais de jeu de démo en production

logging:
  level:
    root: INFO
    com.jodak: INFO
