<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="robots" content="noindex, nofollow"/>
    <title>Connexion — Administration JODAK</title>
    <link rel="icon"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A1%3C/text%3E%3C/svg%3E"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"/>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body data-login>
<div class="login-wrap">
    <form class="login-card" id="login-form">
        <span class="eyebrow">Jeux de la Jeunesse · Dakar 2026</span>
        <div class="login-brand">JODAK&nbsp;Admin</div>
        <p class="muted">Console d'administration sécurisée</p>
        <label>Email
            <input type="email" name="email" autocomplete="username" required/>
        </label>
        <label>Mot de passe
            <input type="password" name="password" autocomplete="current-password" required/>
        </label>
        <button class="btn primary" type="submit">Se connecter</button>
        <p class="error" data-login-error></p>
    </form>
</div>
<div class="toast" data-toast></div>
<script th:src="@{/js/admin.js}" defer></script>
</body>
</html>
