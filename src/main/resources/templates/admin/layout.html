<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, active, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:replace="${title}">Administration — JODAK</title>
    <meta name="robots" content="noindex, nofollow"/>
    <link rel="icon"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A1%3C/text%3E%3C/svg%3E"/>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body data-protected="true">
<div class="admin-shell">
    <aside class="sidebar">
        <a th:href="@{/backoffice/dashboard}" class="brand">🛡️ <span>JODAK&nbsp;Admin</span></a>
        <nav>
            <a th:href="@{/backoffice/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">Tableau de bord</a>
            <a th:href="@{/backoffice/imports}" th:classappend="${active == 'imports'} ? 'active'">Imports</a>
            <a th:href="@{/backoffice/maintenance}" th:classappend="${active == 'maintenance'} ? 'active'">Maintenance</a>
            <a th:href="@{/backoffice/logs}" th:classappend="${active == 'logs'} ? 'active'">Journal</a>
        </nav>
        <button type="button" class="btn ghost logout" data-logout>Déconnexion</button>
    </aside>

    <div class="main">
        <header class="topbar">
            <button class="menu-toggle" type="button" aria-label="Menu">☰</button>
            <h1 th:replace="${title}">Administration</h1>
            <span class="admin-id" data-admin-id></span>
        </header>
        <main class="content">
            <div th:replace="${content}">Contenu</div>
        </main>
    </div>
</div>

<div class="toast" data-toast></div>
<script th:src="@{/js/admin.js}" defer></script>
</body>
</html>
