<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, 'dashboard', ~{::content})}">
<head><title>Tableau de bord</title></head>
<body>
<div th:fragment="content">
    <section class="cards">
        <div class="card"><span class="num" data-stat="totalAthletes">–</span><span>Athlètes</span></div>
        <div class="card"><span class="num" data-stat="totalCountries">–</span><span>Pays</span></div>
        <div class="card"><span class="num" data-stat="totalDisciplines">–</span><span>Disciplines</span></div>
        <div class="card"><span class="num" data-stat="totalEpreuves">–</span><span>Épreuves</span></div>
        <div class="card"><span class="num gold" data-stat="totalMedals">–</span><span>Médailles</span></div>
    </section>

    <section class="panel">
        <h2>Actions</h2>
        <div class="actions">
            <a th:href="@{/backoffice/imports}" class="btn">Importer des données</a>
            <a th:href="@{/backoffice/maintenance}" class="btn">Export / Sauvegarde / Réinitialisation</a>
            <a th:href="@{/backoffice/logs}" class="btn ghost">Journal d'administration</a>
            <a th:href="@{/swagger-ui.html}" class="btn ghost" target="_blank" rel="noopener">API · Swagger</a>
        </div>
    </section>
</div>
</body>
</html>
