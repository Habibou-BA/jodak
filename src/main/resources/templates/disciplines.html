<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Disciplines — Plateforme JO</title>
</head>
<body>
<div th:fragment="content">

    <p class="eyebrow">Référentiel</p>
    <h1 class="page-title">Disciplines</h1>
    <p class="lead">Les disciplines olympiques. Sélectionnez-en une pour consulter ses athlètes.</p>

    <div class="grid cards mt-2" data-reveal th:if="${!page.content.isEmpty()}">
        <a th:each="d : ${page.content}" th:href="@{/athletes(disciplineId=${d.id})}" class="card">
            <h3 th:text="${d.name}">Discipline</h3>
            <p class="meta">Voir les athlètes&nbsp;→</p>
        </a>
    </div>

    <div class="panel empty" th:if="${page.content.isEmpty()}">
        <div class="icon">🎽</div>
        <p>Aucune discipline enregistrée.</p>
    </div>

    <div th:if="${page.totalPages > 1}"
         th:replace="~{fragments/pagination :: pager(
            @{/disciplines(page=${page.page - 1}, size=${page.size})},
            @{/disciplines(page=${page.page + 1}, size=${page.size})},
            'Page ' + ${page.page + 1} + ' / ' + ${page.totalPages} + ' · ' + ${page.totalElements} + ' disciplines',
            ${page.first}, ${page.last})}"></div>

</div>
</body>
</html>
