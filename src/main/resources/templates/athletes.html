<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Athlètes — Plateforme JO</title>
</head>
<body>
<div th:fragment="content">

    <p class="eyebrow">Compétiteurs</p>
    <h1 class="page-title">Athlètes</h1>
    <p class="lead">Recherche multicritère par nom, sexe et discipline.</p>

    <form class="filters mt-2" method="get" th:action="@{/athletes}">
        <div class="field">
            <label for="lastName">Nom</label>
            <input type="text" id="lastName" name="lastName" th:value="${filterLastName}" placeholder="Rechercher un nom…"/>
        </div>
        <div class="field">
            <label for="gender">Sexe</label>
            <select id="gender" name="gender">
                <option value="">Tous</option>
                <option th:each="g : ${genders}"
                        th:value="${g}"
                        th:selected="${filterGender == g.name()}"
                        th:text="${g.name() == 'MALE'} ? 'Homme' : 'Femme'">—</option>
            </select>
        </div>
        <div class="field">
            <label for="disciplineId">Discipline</label>
            <select id="disciplineId" name="disciplineId">
                <option value="">Toutes</option>
                <option th:each="d : ${disciplines}"
                        th:value="${d.id}"
                        th:selected="${filterDisciplineId == #strings.toString(d.id)}"
                        th:text="${d.name}">—</option>
            </select>
        </div>
        <button class="btn btn-primary" type="submit">Filtrer</button>
        <a th:href="@{/athletes}" class="btn btn-ghost">Réinitialiser</a>
    </form>

    <div class="table-wrap" data-reveal th:if="${!page.content.isEmpty()}">
        <table>
            <thead>
            <tr><th>Athlète</th><th>Sexe</th><th>Âge</th><th>Nationalité</th><th>Discipline</th><th>Gabarit</th></tr>
            </thead>
            <tbody>
            <tr th:each="a : ${page.content}">
                <td><strong th:text="${a.lastName + ' ' + a.firstName}">Nom</strong></td>
                <td>
                    <span class="chip"
                          th:classappend="${a.gender.name() == 'MALE'} ? 'gender-male' : 'gender-female'"
                          th:text="${a.gender.name() == 'MALE'} ? 'Homme' : 'Femme'">—</span>
                </td>
                <td><span class="num" th:text="${a.age}">0</span></td>
                <td>
                    <span th:text="${a.country.name}">Nation</span>
                    <span class="sub" th:text="${a.country.code}">COD</span>
                </td>
                <td th:text="${a.discipline.name}">Discipline</td>
                <td>
                    <span class="num" th:text="${a.heightCm} + ' cm'">0 cm</span>
                    <span class="sub" th:text="${a.weightKg} + ' kg'">0 kg</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="panel empty" th:if="${page.content.isEmpty()}">
        <div class="icon">🔍</div>
        <p>Aucun athlète ne correspond à ces critères.</p>
    </div>

    <div th:if="${page.totalPages > 1}"
         th:replace="~{fragments/pagination :: pager(
            @{/athletes(page=${page.page - 1}, size=${page.size}, lastName=${filterLastName}, gender=${filterGender}, disciplineId=${filterDisciplineId})},
            @{/athletes(page=${page.page + 1}, size=${page.size}, lastName=${filterLastName}, gender=${filterGender}, disciplineId=${filterDisciplineId})},
            'Page ' + ${page.page + 1} + ' / ' + ${page.totalPages} + ' · ' + ${page.totalElements} + ' athlètes',
            ${page.first}, ${page.last})}"></div>

</div>
</body>
</html>
