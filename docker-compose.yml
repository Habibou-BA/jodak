services:
  db:
    image: postgres:16-alpine
    container_name: jodak-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olympics}
      POSTGRES_USER: ${POSTGRES_USER:-olympics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olympics}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olympics} -d ${POSTGRES_DB:-olympics}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: jodak-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-olympics}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-olympics}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-olympics}
      # Amorçage de l'administrateur (repris depuis le fichier .env local ; l'admin
      # n'est créé qu'au premier démarrage, si la table admin_user est vide).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Sécurité JWT (à définir en production ; sinon repli sur le défaut de dev).
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-jodak}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P7D}
      # Réinitialisation (désactivée par défaut).
      ADMIN_RESET_ENABLED: ${ADMIN_RESET_ENABLED:-false}
      ADMIN_RESET_CONFIRMATION_PHRASE: ${ADMIN_RESET_CONFIRMATION_PHRASE:-REINITIALISER-DAKAR-2026}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  pgdata:
