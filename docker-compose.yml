services:
  db:
    image: postgres:16-alpine
    container_name: jodak-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olympics}
      POSTGRES_USER: ${POSTGRES_USER:-olympics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olympics}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olympics} -d ${POSTGRES_DB:-olympics}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: jodak-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-olympics}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-olympics}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-olympics}
    ports:
      - "8080:8080"

volumes:
  pgdata:
